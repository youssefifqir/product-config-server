# Configuration for authorization-service - PRODUCTION PROFILE

# Server configuration (different port for production)
server.port=9089

# H2 Database configuration (keeping H2 for auth - lightweight)
spring.datasource.url=jdbc:h2:file:./data/authdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Logging
logging.level.com.youssef.authorizationservice=INFO