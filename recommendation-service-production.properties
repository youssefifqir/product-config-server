# Configuration for recommendation-service - PRODUCTION PROFILE

# Server configuration (different port for production)
server.port=9087

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3308/recommendation_db
spring.datasource.username=recommendation_user
spring.datasource.password=recommendation_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Logging
logging.level.com.youssef.recommendationservice=INFO