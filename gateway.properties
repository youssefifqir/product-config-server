# Configuration spécifique à gateway

# Server configuration
server.port=8765

# Gateway routes configuration

# --- ROUTE 1 : PRODUCT-SERVICE ---
spring.cloud.gateway.server.webflux.routes[0].id=product_route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/products/**

# --- ROUTE 2 : REVIEW-SERVICE ---
spring.cloud.gateway.server.webflux.routes[1].id=review_route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/reviews/**

# --- ROUTE 3 : RECOMMENDATION-SERVICE ---
spring.cloud.gateway.server.webflux.routes[2].id=recommendation_route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://RECOMMENDATION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/recommendations/**

# --- ROUTE 4 : PRODUCT-COMPOSITE-SERVICE ---
spring.cloud.gateway.server.webflux.routes[3].id=product_composite_route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://PRODUCT-COMPOSITE-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/product-composite/**

# --- ROUTE 5 : AUTHORIZATION-SERVICE ---
spring.cloud.gateway.server.webflux.routes[4].id=authorization_route
spring.cloud.gateway.server.webflux.routes[4].uri=lb://AUTHORIZATION-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/auth/**

# Enable discovery locator (optional, for automatic route creation)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=DEBUG
logging.level.com.youssef.gateway.filter=INFO