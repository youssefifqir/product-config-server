# Server configuration
server.port=8765

# Application name
spring.application.name=gateway

# --- ROUTE 1: PRODUCT-COMPOSITE-SERVICE ---
spring.cloud.gateway.routes[0].id=product-composite-route
spring.cloud.gateway.routes[0].uri=lb://PRODUCT-COMPOSITE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/product-composite/**
spring.cloud.gateway.routes[0].filters[0]=Authorization

# --- ROUTE 2: PRODUCT-SERVICE ---
spring.cloud.gateway.routes[1].id=product-route
spring.cloud.gateway.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/products/**
spring.cloud.gateway.routes[1].filters[0]=Authorization

# --- ROUTE 3: REVIEW-SERVICE ---
spring.cloud.gateway.routes[2].id=review-route
spring.cloud.gateway.routes[2].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/reviews/**
spring.cloud.gateway.routes[2].filters[0]=Authorization

# --- ROUTE 4: RECOMMENDATION-SERVICE ---
spring.cloud.gateway.routes[3].id=recommendation-route
spring.cloud.gateway.routes[3].uri=lb://RECOMMENDATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/recommendations/**
spring.cloud.gateway.routes[3].filters[0]=Authorization

# --- ROUTE 5: AUTHORIZATION-SERVICE (NO FILTER) ---
spring.cloud.gateway.routes[4].id=authorization-route
spring.cloud.gateway.routes[4].uri=lb://AUTHORIZATION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/auth/**

# Enable discovery locator (optional)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=DEBUG
logging.level.com.youssef.gateway.filter=INFO