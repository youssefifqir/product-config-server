# Configuration for review-service - PRODUCTION PROFILE

# Server configuration (different port for production)
server.port=9086

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3308/review_db
spring.datasource.username=review_user
spring.datasource.password=review_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Logging
logging.level.com.youssef.reviewservice=INFO